<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c2230;
    --border: #2a3343; --text: #e6edf3; --muted: #8b97a7;
    --accent: #4f8cff; --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
  .app { display: flex; height: 100%; width: 100%; }
  .sidebar { width: 230px; flex: 0 0 230px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 5; }
  .sidebar-head { padding: 16px 16px 10px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
  .brand { font-size: 18px; font-weight: 700; } .brand span { color: var(--accent); }
  .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .palette { padding: 10px; overflow-y: auto; flex: 1; }
  .palette-title { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 8px 6px 8px; }
  .palette-divider { height: 1px; background: var(--border); margin: 10px 6px 8px; }
  .pal-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; margin-bottom: 5px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; cursor: grab; user-select: none; transition: border-color .15s; }
  .pal-item:hover { border-color: var(--accent); } .pal-item:active { cursor: grabbing; }
  .pal-ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-size: 15px; flex: 0 0 30px; }
  .pal-ico-area { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-size: 15px; flex: 0 0 30px; border: 2px dashed currentColor; }
  .pal-label { font-size: 12.5px; font-weight: 500; }
  .pal-note-swatches { display: flex; gap: 3px; margin-left: auto; }
  .pal-swatch { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px; }
  .stage { position: relative; flex: 1; overflow: hidden; }
  svg.canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .toolbar { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; background: rgba(22,27,34,.92); border: 1px solid var(--border); border-radius: 10px; padding: 6px; backdrop-filter: blur(6px); z-index: 4; flex-wrap: wrap; max-width: calc(100vw - 260px); }
  .btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 7px; padding: 7px 11px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: border-color .15s, background .15s; text-decoration: none; }
  .btn:hover { border-color: var(--accent); } .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); } .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-sep { width: 1px; height: 22px; background: var(--border); flex: 0 0 1px; }
  .zoom-pill { font-size: 12px; color: var(--muted); padding: 0 4px; min-width: 44px; text-align: center; }
  /* Project name */
  .project-name { font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; padding: 5px 8px; border-radius: 6px; border: 1px solid transparent; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-name:hover { border-color: var(--border); background: var(--panel-2); }

  .cfg-panel { position: fixed; right: 0; top: 0; height: 100vh; width: 300px; background: var(--panel); border-left: 1px solid var(--border); z-index: 60; display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.4); }
  .cfg-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 8px; flex: 0 0 auto; }
  .cfg-title { font-size: 14px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .cfg-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .cfg-close:hover { color: var(--text); }
  .cfg-body { padding: 14px 16px; overflow-y: auto; flex: 1; }
  .cfg-field { margin-bottom: 14px; }
  .cfg-field.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cfg-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .cfg-field.row .cfg-label { margin-bottom: 0; }
  .cfg-input, .cfg-select { width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); padding: 7px 9px; font-size: 13px; font-family: inherit; outline: none; }
  .cfg-input:focus, .cfg-select:focus { border-color: var(--accent); }
  .cfg-empty { color: var(--muted); font-size: 13px; text-align: center; margin-top: 36px; line-height: 1.6; padding: 0 10px; }
  .cfg-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); margin-bottom: 7px; cursor: pointer; }
  .cfg-check input { accent-color: var(--accent); width: 15px; height: 15px; }
  /* Toggle switch */
  .toggle { position: relative; width: 40px; height: 22px; flex: 0 0 40px; display: inline-block; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .track { position: absolute; inset: 0; background: var(--panel-2); border: 1px solid var(--border); border-radius: 22px; transition: .15s; }
  .toggle .thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: var(--muted); border-radius: 50%; transition: .15s; }
  .toggle input:checked + .track { background: rgba(79,140,255,.3); border-color: var(--accent); }
  .toggle input:checked + .track .thumb { transform: translateX(18px); background: var(--accent); }
  /* Gear icon on node */
  .node-gear { cursor: pointer; opacity: .6; transition: opacity .15s; }
  .node-gear:hover { opacity: 1; }
  /* Validation badge + modal */
  .val-badge { position: relative; }
  .val-count { position: absolute; top: -7px; right: -7px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 5px; min-width: 16px; text-align: center; line-height: 1.4; }
  .val-count.warn { background: #f59e0b; }
  .modal-ov { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 540px; max-width: 92vw; max-height: 84vh; display: flex; flex-direction: column; box-shadow: 0 16px 48px rgba(0,0,0,.6); }
  .modal-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; flex: 0 0 auto; }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-body { padding: 16px 20px; overflow-y: auto; }
  .modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; flex: 0 0 auto; }
  .val-item { display: flex; gap: 9px; padding: 9px 11px; border-radius: 8px; margin-bottom: 7px; font-size: 13px; line-height: 1.45; align-items: flex-start; }
  .val-err { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
  .val-warn { background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); color: #fcd34d; }
  .val-ok { color: #4ade80; text-align: center; padding: 24px; font-size: 14px; }
  .val-sec-title { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 10px 0 8px; }
  .val-sec-title:first-child { margin-top: 0; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #3d7bff; border-color: #3d7bff; }
</style>

];

function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function edgePoint(cx,cy,tx,ty,hw,hh){var dx=tx-cx,dy=ty-cy;if(!dx&&!dy)return[cx,cy];var s=Math.min(dx?hw/Math.abs(dx):Infinity,dy?hh/Math.abs(dy):Infinity);return[cx+dx*s,cy+dy*s];}
var _uid=1; function uid(){return"i"+(_uid++)+"_"+Math.random().toString(36).slice(2,6);}

function applyResize(it,wx,wy,minW,minH){var ddx=wx-it.startWX,ddy=wy-it.startWY,nx=it.origX,ny=it.origY,nw=it.origW,nh=it.origH,hk=it.handle;if(hk.includes("w")){nx=it.origX+ddx;nw=it.origW-ddx;}if(hk.includes("e"))nw=it.origW+ddx;if(hk.includes("n")){ny=it.origY+ddy;nh=it.origH-ddy;}if(hk.includes("s"))nh=it.origH+ddy;if(nw<minW){if(hk.includes("w"))nx=it.origX+it.origW-minW;nw=minW;}if(nh<minH){if(hk.includes("n"))ny=it.origY+it.origH-minH;nh=minH;}return{nx,ny,nw,nh};}
function toRelativeNodes(nds,ars){var aById={};ars.forEach(function(a){aById[a.id]=a;});return nds.map(function(n){if(!n.parentId||!aById[n.parentId])return n;var a=aById[n.parentId];return Object.assign({},n,{x:n.x-a.x,y:n.y-a.y});});}

// ---- v2 Layout Resolution ----
var LAYOUT_NODE_W=140,LAYOUT_NODE_H=44,LAYOUT_GAP=24,LAYOUT_PAD=60;
var COL_EXT=560,COL_NOTE=700;
var ENTRY_TYPES_V2=['internet','cloudflare','waf','cicd'];

function resolveContainer(container,start_y){
  var nodes=[],areas=[];
  var childNodes=(container.children||[]).filter(function(c){return !c.container;});
  var childContainers=(container.children||[]).filter(function(c){return !!c.container;});
  var inner_y=start_y+LAYOUT_PAD;
  var max_width=0;
  if(childNodes.length>0){
    var row_width=childNodes.length*LAYOUT_NODE_W+(childNodes.length-1)*LAYOUT_GAP;
    var row_start_x=-(row_width/2);
    max_width=Math.max(max_width,row_width);
    childNodes.forEach(function(node,i){nodes.push({id:node.id,type:node.type,label:node.label,x:row_start_x+i*(LAYOUT_NODE_W+LAYOUT_GAP),y:inner_y});});
    inner_y+=LAYOUT_NODE_H+LAYOUT_GAP;
  }
  childContainers.forEach(function(sub){
    var result=resolveContainer(sub,inner_y);
    areas=areas.concat(result.areas);nodes=nodes.concat(result.nodes);
    max_width=Math.max(max_width,result.width);inner_y=result.bottom+LAYOUT_GAP;
  });
  var area_w=max_width+LAYOUT_PAD*2;
  var area_h=(inner_y+LAYOUT_PAD)-start_y;
  areas.push({id:container.id,type:container.container,label:container.label,x:-(area_w/2),y:start_y,w:area_w,h:area_h});
  return{nodes:nodes,areas:areas,width:area_w,bottom:start_y+area_h};
}

function resolveLayout(layoutTree,conns,notes){
  var nodes=[],areas=[],cursor_y=-400;
  var entryItems=(layoutTree||[]).filter(function(i){return !i.container&&ENTRY_TYPES_V2.indexOf(i.type)!==-1;});
  var containerItems=(layoutTree||[]).filter(function(i){return !!i.container;});
  var externalItems=(layoutTree||[]).filter(function(i){return !i.container&&ENTRY_TYPES_V2.indexOf(i.type)===-1;});
  var entry_y=cursor_y;
  entryItems.forEach(function(item){nodes.push({id:item.id,type:item.type,label:item.label,x:0,y:entry_y});entry_y+=LAYOUT_NODE_H+LAYOUT_GAP+60;});
  cursor_y=entry_y;
  containerItems.forEach(function(container){
    var result=resolveContainer(container,cursor_y);
    areas=areas.concat(result.areas);nodes=nodes.concat(result.nodes);
    cursor_y=result.bottom+LAYOUT_GAP+60;
  });
  var ext_y=-400;
  externalItems.forEach(function(item){nodes.push({id:item.id,type:item.type,label:item.label,x:COL_EXT,y:ext_y});ext_y+=LAYOUT_NODE_H+LAYOUT_GAP+40;});
  var resolvedNotes=(notes||[]).map(function(note,i){return Object.assign({},note,{x:note.x||COL_NOTE,y:note.y||(-400+i*150),w:note.w||200,h:note.h||120});});
  return{nodes:nodes,areas:areas,conns:conns||[],notes:resolvedNotes};
}

function capWord(s){ s=String(s||''); return s?s.charAt(0).toUpperCase()+s.slice(1):s; }
var STORAGE_LABELS={ wasabi:"Wasabi", cloudflare_r2:"Cloudflare R2", hetzner_os:"Hetzner Object Store", backblaze_b2:"Backblaze B2" };
var LB_LABELS={ hetzner_lb:"Hetzner LB", cloudflare_lb:"Cloudflare LB", traefik_swarm:"Traefik Swarm" };
function computeAutoLabel(type,config){
  if(!config)return null;
  if(type==='vps'){ if(!config.provider||!config.plan)return null; return capWord(config.provider)+' '+String(config.plan).split(' ')[0].toUpperCase(); }
  if(type==='storage')return STORAGE_LABELS[config.provider]||null;
  if(type==='email')return config.provider?capWord(config.provider):null;
  if(type==='loadbalancer')return LB_LABELS[config.provider]||null;
  return null;
}

// ======== Architecture sanitizer ========
function validateArchitecture(nodes, areas, conns) {
  nodes=nodes||[];areas=areas||[];conns=conns||[];
  var errors = [];
  var warnings = [];
  var types = nodes.map(function(n){return n.type;});
  var hasType = function(t){return types.indexOf(t)!==-1;};

  // ── ERRORES ──────────────────────────────────────────

  // VPS sin proveedor configurado
  nodes.filter(function(n){return n.type==='vps';}).forEach(function(n){
    if (!(n.config&&n.config.provider)) {
      errors.push("El VPS \""+n.label+"\" no tiene proveedor configurado. Haz click en ⚙ para seleccionar Hetzner, Contabo, etc.");
    }
  });

  // Redis sin contraseña
  nodes.filter(function(n){return n.type==='redis';}).forEach(function(n){
    if (n.config && n.config.password_required === false) {
      errors.push("Redis \""+n.label+"\" tiene contraseña deshabilitada. Redis sin contraseña es un riesgo crítico de seguridad.");
    }
  });

  // DB sin contenedor
  nodes.filter(function(n){return ['postgres','redis'].indexOf(n.type)!==-1;}).forEach(function(n){
    if (!n.parentId) {
      errors.push("\""+n.label+"\" debe estar dentro de un VPS o red. Arrastra el nodo dentro de un contenedor.");
    }
  });

  // AI Service con acceso público directo
  nodes.filter(function(n){return n.type==='ai';}).forEach(function(n){
    var directConn = conns.find(function(c){
      return (c.to===n.id || c.from===n.id) &&
        nodes.find(function(m){return (m.id===c.from||m.id===c.to) && m.type==='internet';});
    });
    if (directConn) {
      errors.push("El AI Service \""+n.label+"\" está conectado directamente a Internet. Nunca debe tener puerto público — solo accesible desde el backend.");
    }
  });

  // ── ADVERTENCIAS ─────────────────────────────────────

  // VPS con plan pequeño y muchos servicios
  nodes.filter(function(n){return n.type==='vps';}).forEach(function(vps){
    var smallPlans = ['cx21','s-1vcpu-2gb','vps-s','nanode-1gb','vc2-1c-2gb'];
    var plan = (vps.config&&vps.config.plan) || '';
    var isSmall = smallPlans.some(function(p){return plan.indexOf(p)!==-1;});
    var servicesInside = nodes.filter(function(n){return n.parentId===vps.id;}).length;
    if (isSmall && servicesInside > 3) {
      warnings.push("El plan \""+plan+"\" tiene poca RAM. Con "+servicesInside+" servicios puede quedarse sin memoria. Considera un plan superior.");
    }
  });

  // Múltiples backends sin PgBouncer
  var backendCount = types.filter(function(t){return t==='backend';}).length;
  var hasPgBouncer = nodes.some(function(n){return n.type==='postgres' && n.config && n.config.pgbouncer_enabled;});
  if (backendCount > 1 && !hasPgBouncer) {
    warnings.push("Con "+backendCount+" instancias de backend, PgBouncer previene el agotamiento de conexiones en PostgreSQL. Habilítalo en la configuración de PostgreSQL (⚙).");
  }

  // Sin storage para backups
  var hasBackupStorage = nodes.some(function(n){
    return n.type==='storage' && ['backups','general'].indexOf(n.config&&n.config.purpose)!==-1;
  });
  if (!hasBackupStorage && hasType('postgres')) {
    warnings.push("No hay Object Storage para backups de PostgreSQL. Agrega un nodo Storage (Wasabi o R2) con propósito \"backups\".");
  }

  // Multi-VPS sin red privada (Hetzner/DO)
  var vpsNodes = nodes.filter(function(n){return n.type==='vps';});
  if (vpsNodes.length > 1) {
    var providers = vpsNodes.map(function(n){return n.config&&n.config.provider;});
    var allHavePrivateNet = providers.every(function(p){return ['hetzner','digitalocean','vultr','linode'].indexOf(p)!==-1;});
    if (!allHavePrivateNet) {
      warnings.push("Con múltiples VPS, Contabo no soporta red privada entre servidores. La comunicación entre nodos irá por internet público — menos seguro y con latencia mayor.");
    }
  }

  // Sin Traefik con backend expuesto
  if (hasType('backend') && !hasType('traefik') && !hasType('loadbalancer')) {
    warnings.push("Sin Traefik ni Load Balancer, el backend está expuesto directamente. Agrega Traefik para SSL automático y protección de endpoints.");
  }

  // Nivel 3 detectado — K3s recomendado
  var appVPS = nodes.filter(function(n){return n.type==='vps' && n.config && n.config.role==='app';});
  if (appVPS.length >= 3) {
    warnings.push("Con "+appVPS.length+" VPS de aplicación, considera migrar a K3s para autoscaling real. El export actual usa Docker Swarm — funciona pero K3s escala mejor a este nivel.");
  }

  function dedupe(arr){var seen={},out=[];arr.forEach(function(m){if(!seen[m]){seen[m]=1;out.push(m);}});return out;}
  return { errors: dedupe(errors), warnings: dedupe(warnings) };
}

// ── Detección de escenario ────────────────────────
function detectScenario(nodes) {
  var vpsNodes = nodes.filter(function(n){return n.type==='vps';});
  var appVPS   = vpsNodes.filter(function(n){return ['app','app+db'].indexOf((n.config&&n.config.role)||'app+db')!==-1;});
  var dbVPS    = vpsNodes.filter(function(n){return ['db'].indexOf(n.config&&n.config.role)!==-1;});
  if (vpsNodes.length === 1) return { scenario: 1, appVPS: appVPS, dbVPS: dbVPS, vpsNodes: vpsNodes };
  if (vpsNodes.length === 2 && dbVPS.length === 1) return { scenario: 2, appVPS: appVPS, dbVPS: dbVPS, vpsNodes: vpsNodes };
  return { scenario: 3, appVPS: appVPS, dbVPS: dbVPS, vpsNodes: vpsNodes };
}

function generatePostgresConf(ramGB) {
  var shared   = Math.floor(ramGB * 0.25);
  var cache    = Math.floor(ramGB * 0.75);
  var workMem  = Math.floor((ramGB * 1024 * 0.25) / 10);
  var maintMem = Math.floor(ramGB * 0.125 * 1024);
  return `# postgresql.conf — generado por InfraDraw
# Optimizado para ${ramGB}GB RAM

# Memoria
shared_buffers = ${shared}GB
effective_cache_size = ${cache}GB
work_mem = ${workMem}MB
maintenance_work_mem = ${maintMem}MB

# WAL
wal_buffers = 64MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# Conexiones
max_connections = 100
# idle_in_transaction_session_timeout: aborta sesiones que llevan > 10s
# bloqueadas en una transacción (equivalente servidor de connection_timeout).
# connection_timeout NO es un parámetro de postgresql.conf — es de libpq.
idle_in_transaction_session_timeout = 10000
lock_timeout = 30000

# Query planner (SSD)
default_statistics_target = 100
random_page_cost = 1.1

# Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on

# Locale
lc_messages = 'en_US.UTF-8'
`;
}

tcp-keepalive 300

function generateCompose(nodes, areas, scenario, vpsConfig) {
  var hasType = function(t){return nodes.some(function(n){return n.type===t;});};
  var getNode = function(t){return nodes.find(function(n){return n.type===t;});};
  var pgNode  = getNode('postgres');
  var rdNode  = getNode('redis');
  var trNode  = getNode('traefik');
  var pgVersion = (pgNode&&pgNode.config&&pgNode.config.version) || '16';
  var rdVersion = (rdNode&&rdNode.config&&rdNode.config.version) || '7';
  var pgBouncer = (pgNode&&pgNode.config&&pgNode.config.pgbouncer_enabled) || false;
  var ramGB     = getPlanRAM((vpsConfig&&vpsConfig.provider) || 'hetzner', (vpsConfig&&vpsConfig.plan) || 'cx31');

  var hasPublic   = areas.some(function(a){return a.type==='net-public';});
  var hasInternal = areas.some(function(a){return a.type==='net-internal';});
  var hasDB       = areas.some(function(a){return a.type==='net-db';});

  // BUG-5 FIX: Si no se añadieron áreas de red explícitas, definir las redes estándar
  // para que los servicios que las referencian (traefik→public, postgres/redis→internal)
  // sean válidos. Un networks: vacío genera "networks must be a mapping" en docker compose.
  var effectivePublic   = hasPublic   || (!hasPublic && !hasInternal && !hasDB);
  var effectiveInternal = hasInternal || (!hasPublic && !hasInternal && !hasDB);

  var out = `# docker-compose.yml — generado por InfraDraw
# Escenario ${scenario} | ${(vpsConfig&&vpsConfig.provider) || 'hetzner'} ${(vpsConfig&&vpsConfig.plan) || 'cx31'}
# RAM detectada: ${ramGB}GB

networks:
`;

  if (effectivePublic)  out += `  public:\n    driver: bridge\n`;
  if (effectiveInternal) out += `  internal:\n    driver: bridge\n    internal: true\n`;
  if (hasDB)            out += `  db:\n    driver: bridge\n    internal: true\n`;

  out += `\nservices:\n`;

  if (hasType('traefik')) {
    out += `
  traefik:
    image: traefik:${(trNode&&trNode.config&&trNode.config.version) || 'v3.0'}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
      - ./config/traefik.yml:/traefik.yml:ro
      - ./config/middlewares.yml:/dynamic/middlewares.yml:ro
    networks: [public]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(\`traefik.\${DOMAIN}\`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=le"
      - "traefik.http.routers.traefik.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=\${TRAEFIK_DASHBOARD_AUTH}"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"\n`;
  }

  if (hasType('frontend')) {
    var fNets = hasPublic ? '[public]' : '[public, internal]';
    out += `
  frontend:
    image: \${REGISTRY}/frontend:\${VERSION:-latest}
    restart: unless-stopped
    networks: ${fNets}
    environment:
      - NEXT_PUBLIC_API_URL=https://api.\${DOMAIN}
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    allN.forEach(function(n){minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);maxX=Math.max(maxX,n.x+NODE_W);maxY=Math.max(maxY,n.y+NODE_H);});
    allA.forEach(function(a){minX=Math.min(minX,a.x);minY=Math.min(minY,a.y);maxX=Math.max(maxX,a.x+a.w);maxY=Math.max(maxY,a.y+a.h);});

      if(nt.text){

      sv.push('<text x="26" y="'+(NODE_H/2+6)+'" font-size="16" text-anchor="middle">'+def.icon+'</text>');
      sv.push('<text x="44" y="'+(NODE_H/2+5)+'" fill="#e6edf3" font-size="13" font-weight="600" font-family="system-ui,sans-serif">'+esc(n.label)+'</text>');

    sv.push('<text x="'+(wmX-8)+'" y="'+(wmY-6)+'" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#4f8cff" text-anchor="end">◈ InfraDraw</text>');
    sv.push('</svg>');
    var svgStr=sv.join('');
    var blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var img=new Image();
    img.onload=function(){
      var cv=document.createElement('canvas');

      }catch(e){alert('Error al exportar PNG: '+e.message);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);alert('No se pudo generar la imagen. Intenta con JSON.');};
    img.src=url;
  }

  function sanitizeCanvas(d){
    var rawN=Array.isArray(d.nodes)?d.nodes:[],rawA=Array.isArray(d.areas)?d.areas:[],rawNt=Array.isArray(d.notes)?d.notes:[],rawC=Array.isArray(d.conns)?d.conns:[];
    var rawAreas=rawA.filter(function(a){return a&&a.id&&AREA_TYPES[a.type];});
    var rawAById={};rawAreas.forEach(function(a){rawAById[a.id]=a;});
    var areas=rawAreas.map(function(a){
      if(!a.parentId||!rawAById[a.parentId])return a;
      var pa=rawAById[a.parentId];return Object.assign({},a,{x:a.x+pa.x,y:a.y+pa.y,parentId:a.parentId});
    });
    var aById={};areas.forEach(function(a){aById[a.id]=a;});
    var nodes=rawN.filter(function(n){return n&&n.id&&SERVICES[n.type];}).map(function(n){
      if(!n.parentId||!aById[n.parentId])return n;
      var a=aById[n.parentId];return Object.assign({},n,{x:n.x+a.x,y:n.y+a.y});
    });
    var notes=rawNt.filter(function(nt){return nt&&nt.id;}).map(function(nt){return Object.assign({},nt,{colorIdx:clamp(nt.colorIdx||0,0,NOTE_COLORS.length-1),w:nt.w||200,h:nt.h||150});});
    var validIds=new Set(nodes.map(function(n){return n.id;}));
    var conns=rawC.filter(function(c){return c&&c.id&&validIds.has(c.from)&&validIds.has(c.to);});

    return{nodes,areas,notes,conns,skipped};
  }

      return h('select',{className:'cfg-select',value:v,onChange:function(e){onChange(field.key,e.target.value);}},

    }
    if(field.type==='select_dynamic'){
      var depField=schema.fields.filter(function(f){return f.key===field.dependsOn;})[0];
      var depVal=cur[field.dependsOn]!==undefined?cur[field.dependsOn]:(depField?depField.default:undefined);
      var opts=(field.options&&field.options[depVal])||[];

      if(opts.indexOf(dv)===-1)dv=opts[0];
      return h('select',{className:'cfg-select',value:dv,onChange:function(e){onChange(field.key,e.target.value);}},
        opts.map(function(o){return h('option',{key:o,value:o},o);}));

    if(field.type==='text'){
      var tv=cur[field.key]!==undefined?cur[field.key]:field.default;

        return h('label',{key:o,className:'cfg-check'},[

            var na=arr.slice();

            onChange(field.key,na);
          }}),o]);
      }));
    }
    return null;
  }
  function renderToggle(item,field,onChange){
    var cur=item.config||{};
    var v=cur[field.key]!==undefined?cur[field.key]:field.default;
    return h('label',{className:'toggle'},[
      h('input',{key:'i',type:'checkbox',checked:!!v,onChange:function(e){onChange(field.key,e.target.checked);}}),
      h('span',{key:'t',className:'track'},h('span',{className:'thumb'}))

  }
  function renderConfigPanelFor(item,kind){
    var schema=getNodeSchema(item.type);
    var meta=(kind==='area'?AREA_TYPES[item.type]:SERVICES[item.type])||{};
    var onChange=kind==='area'?function(k,v){updateAreaConfig(item.id,k,v);}:function(k,v){updateNodeConfig(item.id,k,v);};
    var close=kind==='area'?function(){setConfigAreaId(null);}:function(){setConfigNodeId(null);};
    var emptyMsg=kind==='area'?'Esta área es solo un contenedor visual; no requiere configuración.':'Este nodo no requiere configuración adicional.';

    else body=schema.fields.map(function(field){
      if(field.type==='boolean')return h('div',{key:field.key,className:'cfg-field row'},[h('span',{className:'cfg-label'},field.label),renderToggle(item,field,onChange)]);

        h('button',{key:'x',className:'cfg-close',title:'Cerrar',onClick:close},'×')

  function renderConfigPanel(){

    if(configAreaId){var area=areas.filter(function(a){return a.id===configAreaId;})[0];if(area)return renderConfigPanelFor(area,'area');}

  }
  var configPanel=renderConfigPanel();

  // Architecture validation
  var valRes=validateArchitecture(nodes,areas,conns);
  var valTotal=valRes.errors.length+valRes.warnings.length;
  function renderValidationModal(){

    if(hasWarn){items.push(h('div',{key:'wt',className:'val-sec-title'},'Advertencias ('+valRes.warnings.length+')'));valRes.warnings.forEach(function(m,i){items.push(h('div',{key:'w'+i,className:'val-item val-warn'},[h('span',{key:'ic'},'⚠️'),h('span',{key:'m'},m)]));});}

    if(!hasErr){
      foot.push(h('button',{key:'exp',className:'btn primary',onClick:function(){setShowValidation(false);doExportZip();}},hasWarn?'Exportar de todas formas':'Exportar proyecto'));
    }

      foot.push(h('button',{key:'exp-err',className:'btn',style:{borderColor:'var(--danger)',color:'var(--danger)'},onClick:function(){setShowValidation(false);doExportZip();}},'⚠️ Exportar con errores'));
    }

      h('div',{className:'modal',onClick:function(e){e.stopPropagation();}},[
        h('div',{key:'h',className:'modal-head'},h('div',{className:'modal-title'},'🔍 Validación de arquitectura')),
        h('div',{key:'b',className:'modal-body'},items),
        h('div',{key:'f',className:'modal-foot'},foot)

  }
  var validationModal=renderValidationModal();

  function renderMigrationModal(){

        items.push(h('div',{key:'m'+i,className:'val-item',style:{color:'#3ddc84'}},[h('span',{key:'ic'},'✓'),h('span',{key:'t'},m.from+' → '+toLabel)]));
      });
    }
    if(removed.length){
      items.push(h('div',{key:'rt',className:'val-sec-title'},'Eliminados ('+removed.length+')'));

      h('div',{className:'modal',onClick:function(e){e.stopPropagation();}},[

        h('div',{key:'b',className:'modal-body'},items),
        h('div',{key:'f',className:'modal-foot'},[h('button',{key:'ok',className:'btn primary',onClick:function(){setMigrationInfo(null);}},'Entendido')])

  var migrationModal=renderMigrationModal();

  // Toolbar
  var hasSelection=!!(selectedId||selectedAreaId||selectedNoteId);
  var saveBadge={saving:h('span',{className:'save-badge save-saving'},'Guardando…'),saved:h('span',{className:'save-badge save-saved'},'✓ Guardado'),unsaved:h('span',{className:'save-badge save-unsaved'},'● Sin guardar'),error:h('span',{className:'save-badge save-err'},'✗ Error')}[saveStatus]||null;
  var projectNameEl=editingName
    ?h('input',{key:'pni',className:'project-name-inp',autoFocus:true,defaultValue:projectName,onClick:function(e){e.stopPropagation();},onBlur:function(e){commitProjectName(e.target.value);},onKeyDown:function(e){if(e.key==='Enter'||e.key==='Escape')e.target.blur();}})
    :h('div',{key:'pn',className:'project-name',onClick:function(){setEditingName(true);},title:'Click para renombrar'},projectName);

  var toolbar=h('div',{className:'toolbar'},[
    h('a',{key:'back',href:'/',className:'btn',style:{textDecoration:'none'}},'← Proyectos'),
    h('div',{key:'s0',className:'btn-sep'}),
    projectNameEl, saveBadge,
    h('div',{key:'s1',className:'btn-sep'}),
    h('button',{key:'c',className:'btn'+(connectMode?' active':''),onClick:function(){var nv=!connectMode;setConnectMode(nv);if(!nv){setConnectSource(null);setCursorWorld(null);}}},[h('span',{key:'i'},'🔗'),connectMode?'Conectando':'Conectar']),
    selectedNoteId?h('button',{key:'color',className:'btn',title:'Cambiar color',onClick:function(){cycleNoteColor(selectedNoteId);}},'🎨'):null,
    h('button',{key:'d',className:'btn danger',disabled:!hasSelection,onClick:function(){if(selectedId)deleteNode(selectedId);else if(selectedAreaId)deleteArea(selectedAreaId);else if(selectedNoteId)deleteNote(selectedNoteId);}},[h('span',{key:'i'},'🗑️'),'Eliminar']),
    h('div',{key:'s2',className:'btn-sep'}),
    h('button',{key:'undo',className:'btn',disabled:undoCount===0,onClick:undo,title:'Deshacer (Ctrl+Z)'},'↩ Deshacer'),
    h('div',{key:'s2b',className:'btn-sep'}),
    h('button',{key:'zo',className:'btn',onClick:function(){zoomBy(1/1.2);}},'−'),
    h('div',{key:'z',className:'zoom-pill'},Math.round(transform.scale*100)+'%'),
    h('button',{key:'zi',className:'btn',onClick:function(){zoomBy(1.2);}},'+'),
    h('button',{key:'rv',className:'btn',onClick:fitToScreen},'⊡ Encuadrar'),
    h('div',{key:'s3',className:'btn-sep'}),
    totalCost>0 ? h('div',{key:'cost',className:'cost-badge',style:{display:'flex',alignItems:'center',background:'var(--panel)',padding:'4px 10px',borderRadius:'4px',fontSize:'12px',fontWeight:'bold',color:'var(--accent)',border:'1px solid var(--border)'}},'💰 Est: ~$'+Math.round(totalCost)+'/mes') : null,
    h('button',{key:'val',className:'btn val-badge',title:'Validar arquitectura',onClick:function(){setShowValidation(true);}},['🔍 Validar',valTotal>0?h('span',{key:'c',className:'val-count'+(valRes.errors.length?'':' warn')},String(valRes.errors.length||valRes.warnings.length)):null]),
    h('div',{key:'expW',className:'export-wrap',onClick:function(e){e.stopPropagation();}},[
      h('button',{key:'exp',className:'btn',onClick:function(){setShowExportMenu(function(v){return !v;});}},['📤 Exportar',' ▾']),
      showExportMenu?h('div',{key:'menu',className:'export-menu'},[
        h('button',{key:'z',className:'btn',onClick:function(){setShowExportMenu(false);exportProject();}},'📦 Exportar proyecto (ZIP)'),
        h('button',{key:'j',className:'btn',onClick:function(){setShowExportMenu(false);exportJSON();}},'📄 Descargar JSON'),
        h('button',{key:'p',className:'btn',onClick:function(){setShowExportMenu(false);exportPNG();}},'🖼️ Exportar PNG'),
      ]):null
    ]),
    h('button',{key:'imp',className:'btn',onClick:importDiagram},'📥 Importar'),
  ]);

  var connectBadge=connectMode&&connectSource==null?h('div',{className:'badge-connect'},'Click en el nodo origen'):connectMode&&connectSource!=null?h('div',{className:'badge-connect'},'Click en el nodo destino  (Esc cancela)'):null;
  var hints=h('div',{className:'hints'},[h('div',{key:'1'},[h('b',{key:'b'},'Pan: '),'click derecho + arrastrar, o ',h('span',{className:'kbd'},'Espacio'),' + arrastrar']),h('div',{key:'2'},[h('b',{key:'b'},'Zoom: '),'rueda del ratón']),h('div',{key:'3'},[h('b',{key:'b'},'Área/Nota: '),'esquinas ◉ para redimensionar']),h('div',{key:'4'},[h('b',{key:'b'},'Conectar: '),'botón Conectar → origen → destino']),h('div',{key:'5'},[h('b',{key:'b'},'Editar: '),'doble click en nodo o área']),h('div',{key:'6'},[h('b',{key:'b'},'Eliminar: '),h('span',{className:'kbd'},'Supr'),' o botón']),h('div',{key:'7'},[h('b',{key:'b'},'Deshacer: '),h('span',{className:'kbd'},'Ctrl+Z'),' o botón'])]);
  var total=nodes.length+areas.length+notes.length;

  var stage=h('div',{className:'stage',ref:stageRef,onDrop,onDragOver},[svg,toolbar,connectBadge,emptyHint,hints,fileInput,loadingOverlay]);
  return h('div',{className:'app'},[sidebar,stage,configPanel,validationModal,migrationModal]);
