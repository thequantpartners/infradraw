  .badge-connect { position: absolute; top: 12px; right: 12px; z-index: 4; background: rgba(79,140,255,.15); border: 1px solid var(--accent); color: var(--accent); padding: 7px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; }
  .edit-input { width: 100%; height: 100%; border: none; outline: none; background: #fff; color: #111; font-size: 13px; font-weight: 600; border-radius: 4px; padding: 0 6px; font-family: inherit; }

function resolveContainer(container,start_y){
  var nodes=[],areas=[];
  var childNodes=(container.children||[]).filter(function(c){return !c.container;});
  var childContainers=(container.children||[]).filter(function(c){return !!c.container;});
  var inner_y=start_y+LAYOUT_PAD;
  var max_width=0;
  if(childNodes.length>0){
    var row_width=childNodes.length*LAYOUT_NODE_W+(childNodes.length-1)*LAYOUT_GAP;
    var row_start_x=-(row_width/2);
    max_width=Math.max(max_width,row_width);
    childNodes.forEach(function(node,i){nodes.push({id:node.id,type:node.type,label:node.label,x:row_start_x+i*(LAYOUT_NODE_W+LAYOUT_GAP),y:inner_y});});
    inner_y+=LAYOUT_NODE_H+LAYOUT_GAP;
  }
  childContainers.forEach(function(sub){
    var result=resolveContainer(sub,inner_y);
    areas=areas.concat(result.areas);nodes=nodes.concat(result.nodes);
    max_width=Math.max(max_width,result.width);inner_y=result.bottom+LAYOUT_GAP;
  });
  var area_w=max_width+LAYOUT_PAD*2;
  var area_h=(inner_y+LAYOUT_PAD)-start_y;
  areas.push({id:container.id,type:container.container,label:container.label,x:-(area_w/2),y:start_y,w:area_w,h:area_h});
  return{nodes:nodes,areas:areas,width:area_w,bottom:start_y+area_h};
}

function resolveLayout(layoutTree,conns,notes){
  var nodes=[],areas=[],cursor_y=-400;
  var entryItems=(layoutTree||[]).filter(function(i){return !i.container&&ENTRY_TYPES_V2.indexOf(i.type)!==-1;});
  var containerItems=(layoutTree||[]).filter(function(i){return !!i.container;});
  var externalItems=(layoutTree||[]).filter(function(i){return !i.container&&ENTRY_TYPES_V2.indexOf(i.type)===-1;});
  var entry_y=cursor_y;
  entryItems.forEach(function(item){nodes.push({id:item.id,type:item.type,label:item.label,x:0,y:entry_y});entry_y+=LAYOUT_NODE_H+LAYOUT_GAP+60;});
  cursor_y=entry_y;
  containerItems.forEach(function(container){
    var result=resolveContainer(container,cursor_y);
    areas=areas.concat(result.areas);nodes=nodes.concat(result.nodes);
    cursor_y=result.bottom+LAYOUT_GAP+60;
  });
  var ext_y=-400;
  externalItems.forEach(function(item){nodes.push({id:item.id,type:item.type,label:item.label,x:COL_EXT,y:ext_y});ext_y+=LAYOUT_NODE_H+LAYOUT_GAP+40;});
  var resolvedNotes=(notes||[]).map(function(note,i){return Object.assign({},note,{x:note.x||COL_NOTE,y:note.y||(-400+i*150),w:note.w||200,h:note.h||120});});
  return{nodes:nodes,areas:areas,conns:conns||[],notes:resolvedNotes};
}

  var [connectMode,setConnectMode]=useState(false); var [connectSource,setConnectSource]=useState(null);
  var [editingId,setEditingId]=useState(null); var [editingAreaId,setEditingAreaId]=useState(null); var [editingNoteId,setEditingNoteId]=useState(null);

  // Sync refs
  selectedIdRef.current=selectedId; selectedAreaIdRef.current=selectedAreaId; selectedNoteIdRef.current=selectedNoteId;

  function screenToWorld(cx,cy){var rect=svgRef.current.getBoundingClientRect(),t=transformRef.current;return{x:(cx-rect.left-t.x)/t.scale,y:(cy-rect.top-t.y)/t.scale};}

  // ---- Project management ----
  function doSave(){
    var id=projectIdRef.current; if(!id) return;

      sv.push('<text x="26" y="'+(NODE_H/2+6)+'" font-size="16" text-anchor="middle">'+def.icon+'</text>');

  }
