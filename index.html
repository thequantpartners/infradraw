<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InfraDraw — Canvas de Infraestructura</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2230;
    --border: #2a3343;
    --text: #e6edf3;
    --muted: #8b97a7;
    --accent: #4f8cff;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  .app { display: flex; height: 100%; width: 100%; }

  .sidebar {
    width: 230px;
    flex: 0 0 230px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 5;
  }
  .sidebar-head {
    padding: 16px 16px 10px;
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: .3px; }
  .brand span { color: var(--accent); }
  .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .palette {
    padding: 10px;
    overflow-y: auto;
    flex: 1;
  }
  .palette-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); margin: 8px 6px 8px;
  }
  .palette-divider {
    height: 1px; background: var(--border); margin: 10px 6px 8px;
  }
  .pal-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; margin-bottom: 5px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: grab;
    user-select: none;
    transition: border-color .15s;
  }
  .pal-item:hover { border-color: var(--accent); }
  .pal-item:active { cursor: grabbing; }
  .pal-ico {
    width: 30px; height: 30px; border-radius: 7px;
    display: grid; place-items: center; font-size: 15px;
    flex: 0 0 30px;
  }
  .pal-ico-area {
    width: 30px; height: 30px; border-radius: 7px;
    display: grid; place-items: center; font-size: 15px;
    flex: 0 0 30px; border: 2px dashed currentColor;
  }
  .pal-label { font-size: 12.5px; font-weight: 500; }
  .pal-note-swatches {
    display: flex; gap: 3px; margin-left: auto;
  }
  .pal-swatch {
    width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px;
  }

  .stage { position: relative; flex: 1; overflow: hidden; }
  svg.canvas { width: 100%; height: 100%; display: block; touch-action: none; }

  .toolbar {
    position: absolute; top: 12px; left: 12px;
    display: flex; gap: 8px; align-items: center;
    background: rgba(22,27,34,.92);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    backdrop-filter: blur(6px);
    z-index: 4;
  }
  .btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 11px;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-sep { width: 1px; height: 22px; background: var(--border); }
  .zoom-pill {
    margin-left: 4px; font-size: 12px; color: var(--muted);
    padding: 0 4px; min-width: 44px; text-align: center;
  }
  .hints {
    position: absolute; bottom: 12px; left: 12px;
    background: rgba(22,27,34,.9);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 11.5px; color: var(--muted);
    line-height: 1.7; max-width: 340px; z-index: 4;
  }
  .hints b { color: var(--text); }
  .kbd {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; font-size: 11px; color: var(--text);
  }
  .empty-hint {
    position: absolute; inset: 0; display: grid; place-items: center;
    pointer-events: none; color: var(--muted); font-size: 15px;
  }
  .badge-connect {
    position: absolute; top: 12px; right: 12px; z-index: 4;
    background: rgba(79,140,255,.15);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 7px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
  }
  .edit-input {
    width: 100%; height: 100%;
    border: none; outline: none;
    background: #fff; color: #111;
    font-size: 13px; font-weight: 600;
    border-radius: 4px; padding: 0 6px;
    font-family: inherit;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
"use strict";
var h = React.createElement;
var useState = React.useState, useRef = React.useRef, useEffect = React.useEffect;

// ---- Catálogo de servicios ----
var SERVICES = {
  // Enrutamiento & App
  traefik:      { label: "Traefik",         icon: "🔀", color: "#24A1C1" },
  nginx:        { label: "Nginx",           icon: "⚡", color: "#009900" },
  easypanel:    { label: "EasyPanel",       icon: "🎛️", color: "#6366f1" },
  frontend:     { label: "Frontend (Next)", icon: "▲",  color: "#5b6470" },
  backend:      { label: "Backend (Node)",  icon: "⚙️", color: "#539E43" },
  ai:           { label: "AI (FastAPI)",    icon: "🤖", color: "#0c8f82" },
  // Datos & Colas
  postgres:     { label: "PostgreSQL",      icon: "🐘", color: "#336791" },
  pgbouncer:    { label: "PgBouncer",       icon: "🔃", color: "#4169E1" },
  redis:        { label: "Redis",           icon: "🔴", color: "#DC382D" },
  bullmq:       { label: "BullMQ",          icon: "📬", color: "#9B2335" },
  minio:        { label: "MinIO",           icon: "📦", color: "#C72D48" },
  wasabi:       { label: "Wasabi",          icon: "🪣", color: "#00C36F" },
  // Observabilidad
  prometheus:   { label: "Prometheus",      icon: "🔥", color: "#E6522C" },
  grafana:      { label: "Grafana",         icon: "📊", color: "#F46800" },
  loki:         { label: "Loki",            icon: "🪵", color: "#F4A261" },
  sentry:       { label: "Sentry",          icon: "🐛", color: "#7c3aed" },
  // Infraestructura & Externos
  cloudflare:   { label: "Cloudflare",      icon: "☁️", color: "#F38020" },
  hetzner:      { label: "Hetzner VPS",     icon: "🖥️", color: "#D50C2D" },
  loadbalancer: { label: "Load Balancer",   icon: "⚖️", color: "#8E44AD" },
  wireguard:    { label: "WireGuard",       icon: "🔐", color: "#88171A" },
  internet:     { label: "Internet / User", icon: "🌍", color: "#475569" },
  smtp:         { label: "SMTP / Email",    icon: "📧", color: "#059669" },
  cicd:         { label: "CI/CD Pipeline",  icon: "🚀", color: "#2088FF" }
};

var PALETTE_GROUPS = [
  { title: "Enrutamiento & App",  keys: ["traefik","nginx","easypanel","frontend","backend","ai"] },
  { title: "Datos & Colas",       keys: ["postgres","pgbouncer","redis","bullmq","minio","wasabi"] },
  { title: "Observabilidad",      keys: ["prometheus","grafana","loki","sentry"] },
  { title: "Infraestructura",     keys: ["cloudflare","hetzner","loadbalancer","wireguard","internet","smtp","cicd"] }
];

// ---- Catálogo de áreas de red ----
var AREA_TYPES = {
  "net-public":   { label: "Red Pública",    icon: "🌐", color: "#F38020", fill: "rgba(243,128,32,.08)",  dash: "9 5"  },
  "net-internal": { label: "Red Interna",    icon: "🔒", color: "#4f8cff", fill: "rgba(79,140,255,.08)", dash: "9 5"  },
  "net-db":       { label: "Red DB",          icon: "🗄️", color: "#39b75d", fill: "rgba(57,183,93,.08)",  dash: "9 5"  },
  "vps":          { label: "VPS / Servidor",  icon: "🖥️", color: "#c0392b", fill: "rgba(192,57,43,.08)",  dash: null   },
  "cluster":      { label: "Clúster / K8s",   icon: "☸️", color: "#00b4d8", fill: "rgba(0,180,216,.08)", dash: "13 6" },
  "region":       { label: "Datacenter",      icon: "🏢", color: "#8E44AD", fill: "rgba(142,68,173,.08)", dash: "15 7" }
};
var AREA_ORDER = ["net-public","net-internal","net-db","vps","cluster","region"];

// ---- Colores de notas ----
var NOTE_COLORS = [
  { bg: "#fef9c3", header: "#fde68a", border: "#d4a017", text: "#78350f" },  // amarillo
  { bg: "#dbeafe", header: "#bfdbfe", border: "#3b82f6", text: "#1e3a5f" },  // azul
  { bg: "#dcfce7", header: "#bbf7d0", border: "#16a34a", text: "#14532d" },  // verde
  { bg: "#fce7f3", header: "#fbcfe8", border: "#db2777", text: "#831843" },  // rosa
  { bg: "#ede9fe", header: "#ddd6fe", border: "#7c3aed", text: "#3b0764" }   // violeta
];

var NODE_W = 168, NODE_H = 58, GRID = 40;
var AREA_DEF_W = 340, AREA_DEF_H = 240;
var NOTE_DEF_W = 200, NOTE_DEF_H = 150;
var MIN_SCALE = 0.18, MAX_SCALE = 4;
var HANDLE_R = 6;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function edgePoint(cx, cy, tx, ty, hw, hh) {
  var dx = tx - cx, dy = ty - cy;
  if (dx === 0 && dy === 0) return [cx, cy];
  var sx = dx !== 0 ? hw / Math.abs(dx) : Infinity;
  var sy = dy !== 0 ? hh / Math.abs(dy) : Infinity;
  var t = Math.min(sx, sy);
  return [cx + dx * t, cy + dy * t];
}

var _uid = 1;
function uid() { return "i" + (_uid++) + "_" + Math.random().toString(36).slice(2, 6); }

var HANDLES = [
  { key: "nw", fx: 0,   fy: 0,   cursor: "nwse-resize" },
  { key: "n",  fx: 0.5, fy: 0,   cursor: "ns-resize"   },
  { key: "ne", fx: 1,   fy: 0,   cursor: "nesw-resize" },
  { key: "e",  fx: 1,   fy: 0.5, cursor: "ew-resize"   },
  { key: "se", fx: 1,   fy: 1,   cursor: "nwse-resize" },
  { key: "s",  fx: 0.5, fy: 1,   cursor: "ns-resize"   },
  { key: "sw", fx: 0,   fy: 1,   cursor: "nesw-resize" },
  { key: "w",  fx: 0,   fy: 0.5, cursor: "ew-resize"   }
];

// Shared resize delta computation (returns {nx,ny,nw,nh})
function applyResize(it, wx, wy, minW, minH) {
  var ddx = wx - it.startWX, ddy = wy - it.startWY;
  var nx = it.origX, ny = it.origY, nw = it.origW, nh = it.origH;
  var hk = it.handle;
  if (hk.includes("w")) { nx = it.origX + ddx; nw = it.origW - ddx; }
  if (hk.includes("e")) { nw = it.origW + ddx; }
  if (hk.includes("n")) { ny = it.origY + ddy; nh = it.origH - ddy; }
  if (hk.includes("s")) { nh = it.origH + ddy; }
  if (nw < minW) { if (hk.includes("w")) nx = it.origX + it.origW - minW; nw = minW; }
  if (nh < minH) { if (hk.includes("n")) ny = it.origY + it.origH - minH; nh = minH; }
  return { nx: nx, ny: ny, nw: nw, nh: nh };
}

function App() {
  var sn = useState([]); var nodes = sn[0], setNodes = sn[1];
  var sa = useState([]); var areas = sa[0], setAreas = sa[1];
  var snt = useState([]); var notes = snt[0], setNotes = snt[1];
  var sc = useState([]); var conns = sc[0], setConns = sc[1];
  var st = useState({ x: 0, y: 0, scale: 1 }); var transform = st[0], _setT = st[1];

  var ss  = useState(null); var selectedId     = ss[0],  setSelectedId     = ss[1];
  var ssa = useState(null); var selectedAreaId = ssa[0], setSelectedAreaId = ssa[1];
  var ssn = useState(null); var selectedNoteId = ssn[0], setSelectedNoteId = ssn[1];

  var scm = useState(false); var connectMode   = scm[0], setConnectMode   = scm[1];
  var scs = useState(null);  var connectSource = scs[0], setConnectSource = scs[1];

  var se  = useState(null); var editingId     = se[0],  setEditingId     = se[1];
  var sea = useState(null); var editingAreaId = sea[0], setEditingAreaId = sea[1];
  var sen = useState(null); var editingNoteId = sen[0], setEditingNoteId = sen[1];

  var scw = useState(null); var cursorWorld = scw[0], setCursorWorld = scw[1];

  var svgRef      = useRef(null);
  var stageRef    = useRef(null);
  var fileInputRef= useRef(null);
  var transformRef     = useRef(transform);
  var spaceRef         = useRef(false);
  var inter            = useRef({ mode: "idle" });
  var selectedIdRef    = useRef(null);
  var selectedAreaIdRef= useRef(null);
  var selectedNoteIdRef= useRef(null);
  var connectModeRef   = useRef(false);
  var connectSourceRef = useRef(null);
  var editingNoteIdRef = useRef(null);

  selectedIdRef.current     = selectedId;
  selectedAreaIdRef.current = selectedAreaId;
  selectedNoteIdRef.current = selectedNoteId;
  connectModeRef.current    = connectMode;
  connectSourceRef.current  = connectSource;
  editingNoteIdRef.current  = editingNoteId;

  function setTransform(next) { transformRef.current = next; _setT(next); }

  function screenToWorld(clientX, clientY) {
    var rect = svgRef.current.getBoundingClientRect();
    var t = transformRef.current;
    return { x: (clientX - rect.left - t.x) / t.scale, y: (clientY - rect.top - t.y) / t.scale };
  }

  function clearSelection() { setSelectedId(null); setSelectedAreaId(null); setSelectedNoteId(null); }

  function addNodeAt(type, wx, wy) {
    if (!SERVICES[type]) return;
    var id = uid();
    setNodes(function (p) { return p.concat([{ id: id, type: type, x: wx - NODE_W / 2, y: wy - NODE_H / 2, label: SERVICES[type].label }]); });
    setSelectedId(id); setSelectedAreaId(null); setSelectedNoteId(null);
  }

  function addAreaAt(type, wx, wy) {
    if (!AREA_TYPES[type]) return;
    var id = uid();
    setAreas(function (p) { return p.concat([{ id: id, type: type, x: wx - AREA_DEF_W / 2, y: wy - AREA_DEF_H / 2, w: AREA_DEF_W, h: AREA_DEF_H, label: AREA_TYPES[type].label }]); });
    setSelectedAreaId(id); setSelectedId(null); setSelectedNoteId(null);
  }

  function addNoteAt(wx, wy) {
    var id = uid();
    setNotes(function (p) { return p.concat([{ id: id, x: wx - NOTE_DEF_W / 2, y: wy - NOTE_DEF_H / 2, w: NOTE_DEF_W, h: NOTE_DEF_H, text: "", colorIdx: 0 }]); });
    setSelectedNoteId(id); setSelectedId(null); setSelectedAreaId(null);
  }

  function deleteNode(id) {
    if (!id) return;
    setNodes(function (p) { return p.filter(function (n) { return n.id !== id; }); });
    setConns(function (p) { return p.filter(function (c) { return c.from !== id && c.to !== id; }); });
    if (selectedIdRef.current === id) setSelectedId(null);
    if (connectSourceRef.current === id) { setConnectSource(null); setCursorWorld(null); }
  }

  function deleteArea(id) {
    if (!id) return;
    setAreas(function (p) { return p.filter(function (a) { return a.id !== id; }); });
    if (selectedAreaIdRef.current === id) setSelectedAreaId(null);
  }

  function deleteNote(id) {
    if (!id) return;
    setNotes(function (p) { return p.filter(function (n) { return n.id !== id; }); });
    if (selectedNoteIdRef.current === id) setSelectedNoteId(null);
  }

  function addConnection(from, to) {
    if (from === to) return;
    setConns(function (p) {
      for (var i = 0; i < p.length; i++) {
        if ((p[i].from === from && p[i].to === to) || (p[i].from === to && p[i].to === from)) return p;
      }
      return p.concat([{ id: uid(), from: from, to: to }]);
    });
  }

  function handleNodeClick(id) {
    if (!connectModeRef.current) { setSelectedId(id); setSelectedAreaId(null); setSelectedNoteId(null); return; }
    var src = connectSourceRef.current;
    if (src == null) { setConnectSource(id); setSelectedId(id); setSelectedAreaId(null); setSelectedNoteId(null); }
    else if (src !== id) { addConnection(src, id); setConnectSource(null); setCursorWorld(null); }
    else { setConnectSource(null); setCursorWorld(null); }
  }

  function commitLabel(id, val) {
    var v = (val || "").trim();
    setNodes(function (p) { return p.map(function (n) { return n.id === id ? Object.assign({}, n, { label: v || n.label }) : n; }); });
    setEditingId(null);
  }

  function commitAreaLabel(id, val) {
    var v = (val || "").trim();
    setAreas(function (p) { return p.map(function (a) { return a.id === id ? Object.assign({}, a, { label: v || a.label }) : a; }); });
    setEditingAreaId(null);
  }

  function commitNoteText(id, text) {
    setNotes(function (p) { return p.map(function (n) { return n.id === id ? Object.assign({}, n, { text: text }) : n; }); });
    setEditingNoteId(null);
  }

  // ---- Pointer handlers ----
  function startPan(e) {
    var t = transformRef.current;
    inter.current = { mode: "pan", sx: e.clientX, sy: e.clientY, ox: t.x, oy: t.y };
  }

  function onBgPointerDown(e) {
    if (e.button === 2 || (e.button === 0 && spaceRef.current)) { startPan(e); return; }
    if (e.button === 0) {
      clearSelection();
      if (connectModeRef.current) { setConnectSource(null); setCursorWorld(null); }
    }
  }

  function onNodePointerDown(e, node) {
    e.stopPropagation();
    if (e.button === 2 || (e.button === 0 && spaceRef.current)) { startPan(e); return; }
    if (e.button !== 0) return;
    setSelectedId(node.id); setSelectedAreaId(null); setSelectedNoteId(null);
    var w = screenToWorld(e.clientX, e.clientY);
    inter.current = { mode: "drag", id: node.id, startWX: w.x, startWY: w.y, nodeX: node.x, nodeY: node.y, moved: false };
  }

  function onAreaBodyPointerDown(e, area) {
    e.stopPropagation();
    if (e.button === 2 || (e.button === 0 && spaceRef.current)) { startPan(e); return; }
    if (e.button !== 0) return;
    setSelectedAreaId(area.id); setSelectedId(null); setSelectedNoteId(null);
    var w = screenToWorld(e.clientX, e.clientY);
    inter.current = { mode: "area-drag", id: area.id, startWX: w.x, startWY: w.y, areaX: area.x, areaY: area.y, moved: false };
  }

  function onAreaHandlePointerDown(e, area, hk) {
    e.stopPropagation();
    if (e.button !== 0) return;
    var w = screenToWorld(e.clientX, e.clientY);
    inter.current = { mode: "area-resize", id: area.id, handle: hk, startWX: w.x, startWY: w.y, origX: area.x, origY: area.y, origW: area.w, origH: area.h };
  }

  function onNoteBodyPointerDown(e, note) {
    e.stopPropagation();
    if (e.button === 2 || (e.button === 0 && spaceRef.current)) { startPan(e); return; }
    if (e.button !== 0) return;
    if (editingNoteIdRef.current === note.id) return; // don't drag while text editing
    setSelectedNoteId(note.id); setSelectedId(null); setSelectedAreaId(null);
    var w = screenToWorld(e.clientX, e.clientY);
    inter.current = { mode: "note-drag", id: note.id, startWX: w.x, startWY: w.y, noteX: note.x, noteY: note.y, moved: false };
  }

  function onNoteHandlePointerDown(e, note, hk) {
    e.stopPropagation();
    if (e.button !== 0) return;
    var w = screenToWorld(e.clientX, e.clientY);
    inter.current = { mode: "note-resize", id: note.id, handle: hk, startWX: w.x, startWY: w.y, origX: note.x, origY: note.y, origW: note.w, origH: note.h };
  }

  // ---- Global move / up ----
  useEffect(function () {
    function onMove(e) {
      var it = inter.current;
      if (it.mode === "pan") {
        var t = transformRef.current;
        setTransform({ x: it.ox + (e.clientX - it.sx), y: it.oy + (e.clientY - it.sy), scale: t.scale });

      } else if (it.mode === "drag") {
        var w = screenToWorld(e.clientX, e.clientY);
        var dx = w.x - it.startWX, dy = w.y - it.startWY;
        if (!it.moved && Math.hypot(dx, dy) * transformRef.current.scale > 3) it.moved = true;
        setNodes(function (p) { return p.map(function (n) { return n.id === it.id ? Object.assign({}, n, { x: it.nodeX + dx, y: it.nodeY + dy }) : n; }); });

      } else if (it.mode === "area-drag") {
        var w2 = screenToWorld(e.clientX, e.clientY);
        var dx2 = w2.x - it.startWX, dy2 = w2.y - it.startWY;
        if (!it.moved && Math.hypot(dx2, dy2) * transformRef.current.scale > 3) it.moved = true;
        setAreas(function (p) { return p.map(function (a) { return a.id === it.id ? Object.assign({}, a, { x: it.areaX + dx2, y: it.areaY + dy2 }) : a; }); });

      } else if (it.mode === "area-resize") {
        var w3 = screenToWorld(e.clientX, e.clientY);
        var r = applyResize(it, w3.x, w3.y, 120, 80);
        setAreas(function (p) { return p.map(function (a) { return a.id === it.id ? Object.assign({}, a, { x: r.nx, y: r.ny, w: r.nw, h: r.nh }) : a; }); });

      } else if (it.mode === "note-drag") {
        var w4 = screenToWorld(e.clientX, e.clientY);

    h("div", { key: "3" }, [h("b", { key: "b" }, "Área / Nota: "), "arrastra las esquinas ◉ para redimensionar"]),
    h("div", { key: "4" }, [h("b", { key: "b" }, "Nota: "), "doble click para editar · 🎨 para cambiar color"]),
    h("div", { key: "5" }, [h("b", { key: "b" }, "Conectar: "), "botón Conectar → origen → destino"]),
    h("div", { key: "6" }, [h("b", { key: "b" }, "Editar nombre: "), "doble click en nodo o área"]),
    h("div", { key: "7" }, [h("b", { key: "b" }, "Eliminar: "), h("span", { className: "kbd" }, "Supr"), " o botón"])
  ]);

  var total = nodes.length + areas.length + notes.length;
  var emptyHint = total === 0
    ? h("div", { className: "empty-hint" }, "Arrastra servicios, redes o notas desde el panel para empezar")
    : null;

  var fileInput = h("input", { type: "file", accept: ".json,application/json", ref: fileInputRef, style: { display: "none" }, onChange: onFileChange });

  var stage = h("div", { className: "stage", ref: stageRef, onDrop: onDrop, onDragOver: onDragOver }, [
    svg, toolbar, connectBadge, emptyHint, hints, fileInput
  ]);

  return h("div", { className: "app" }, [sidebar, stage]);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
